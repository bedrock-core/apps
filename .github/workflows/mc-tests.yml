name: GameTests (BDS)

on:
  push:
    branches: [main]
  pull_request:
    types: [labeled, synchronize]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mc-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gametest:
    if: >-
      github.event_name != 'pull_request' ||
      contains(github.event.pull_request.labels.*.name, 'run-mc-tests')
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7
      - run: corepack enable
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: yarn
      - run: yarn install --immutable
      - name: Read the pinned server version
        id: bds
        run: echo "version=$(jq -r .version bds-runner.json)" >> "$GITHUB_OUTPUT"
      - name: Cache Bedrock Dedicated Server
        uses: actions/cache@v6
        with:
          path: .bds/cache
          key: bds-${{ runner.os }}-${{ steps.bds.outputs.version }}
      - name: Config GameTests
        run: yarn test:mc --json .bds/results/config.json
      - name: Upload server evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: config-gametest-results
          path: |
            .bds/logs/**
            .bds/results/**
          if-no-files-found: warn
          retention-days: 14
