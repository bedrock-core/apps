# Lint, typecheck and unit-test the apps.
#
# Nothing is checked out beside this repo: every dependency resolves from exact public
# registry versions, and the immutable install proves no sibling checkout is required.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: apps

    steps:
      - uses: actions/checkout@v7
        with:
          path: apps

      - uses: actions/setup-node@v7
        with:
          node-version: 26.13.0
          package-manager-cache: false

      - name: Install pinned Corepack before restoring the Yarn cache
        run: |
          npm install --global corepack@0.36.0
          corepack enable yarn

      - uses: actions/setup-node@v7
        with:
          node-version: 26.13.0
          cache: yarn
          cache-dependency-path: apps/yarn.lock

      - run: yarn install --immutable

      - run: yarn lint

      - run: yarn typecheck

      - run: yarn test
